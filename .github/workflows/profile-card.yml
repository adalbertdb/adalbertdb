name: Update profile card

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_profile.py
      - .github/workflows/profile-card.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy
      - run: python scripts/generate_profile.py
        env:
          # Optional: a personal access token (repo + read:user) in the ACCESS_TOKEN
          # secret also counts private contributions. Falls back to GITHUB_TOKEN.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg ascii_avatar.txt stats_cache.json
          git diff --cached --quiet || (git commit -m "Update profile card" && git push)
